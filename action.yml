name: Certificate Expiry Check
author: Sanctum SecOps LLC
description: Checks X.509 certificates for imminent expiry, from files in the repository or from live TLS endpoints, and fails the job inside a configurable threshold. Reports subject, issuer, serial, validity window, signature algorithm, and key type for every certificate examined, and flags certificates signed with algorithms that a post-quantum migration will have to replace. Intended to run on a schedule so expiry is caught by CI rather than by an outage.
branding:
  icon: award
  color: purple
inputs:
  paths:
    description: Newline-separated certificate file paths or globs to check. Leave empty to check endpoints only.
    required: false
    default: ''
  endpoints:
    description: Newline-separated host:port TLS endpoints to check. Port defaults to 443 when omitted.
    required: false
    default: ''
  warn-days:
    description: Emit a warning when a certificate expires within this many days.
    required: false
    default: '30'
  fail-days:
    description: Fail the job when a certificate expires within this many days.
    required: false
    default: '7'
  flag-pre-quantum:
    description: Whether to flag certificates signed with pre-quantum signature algorithms as findings.
    required: false
    default: 'true'
  show-cta:
    description: Append a one-line Sanctum SecOps help link to the job summary. Set to 'false' to hide it.
    required: false
    default: 'true'
outputs:
  expiring-count:
    description: Number of certificates inside the warning threshold.
    value: ${{ steps.run-action.outputs.expiring-count }}
  soonest-expiry:
    description: ISO 8601 date of the earliest certificate expiry observed.
    value: ${{ steps.run-action.outputs.soonest-expiry }}
runs:
  using: composite
  steps:
  - id: py
    name: Set up Python 3.11 (isolated from the caller's PATH)
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      update-environment: false
  - name: Install certificate parsing dependency
    shell: bash
    run: exec "$PY" -m pip install --requirement "${{ github.action_path }}/requirements.txt"
    env:
      PY: ${{ steps.py.outputs.python-path }}
  - id: run-action
    name: Certificate Expiry Check
    shell: bash
    run: exec "$PY" "${{ github.action_path }}/scripts/cert_expiry_check.py" --paths "${{ inputs.paths }}" --endpoints "${{ inputs.endpoints }}" --warn-days "${{ inputs.warn-days }}" --fail-days "${{ inputs.fail-days }}" --flag-pre-quantum "${{ inputs.flag-pre-quantum }}"
    env:
      PY: ${{ steps.py.outputs.python-path }}
  - name: Summary footer
    if: always() && inputs.show-cta == 'true'
    shell: bash
    env:
      CTA_URL: https://sanctumsecops.com/contact?utm_source=github&utm_medium=marketplace-action&utm_campaign=action-cert-expiry-check&utm_content=pki-certificate-lifecycle
      CTA_TEXT: Tired of certificate fire drills? Sanctum SecOps runs managed PKI and certificate lifecycle for regulated teams.
    run: |
      if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
        printf '\n---\n%s [Talk to Sanctum SecOps](%s)\n' "$CTA_TEXT" "$CTA_URL" >> "$GITHUB_STEP_SUMMARY"
      fi
