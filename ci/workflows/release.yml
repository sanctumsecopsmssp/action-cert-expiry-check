name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the leading v (e.g. 1.0.0)
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $VERSION"; exit 1; }
      - name: Tag vX.Y.Z and move the major tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR="v${VERSION%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git tag -fa "$MAJOR" -m "$MAJOR -> v$VERSION"
          git push origin "v$VERSION"
          git push -f origin "$MAJOR"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
